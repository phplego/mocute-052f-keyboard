[platformio]
default_envs = keyboard
extra_configs = local/platformio.ini

[env:keyboard]
platform = symlink://platform
extra_scripts = post:tools/platformio-upload.py
lib_deps =
    ch573-sdk=https://github.com/SoCXin/CH573.git#c10f7341c92647eca9a3545a5cd3943121e79d21
build_flags =
    -DCENTRAL_MAX_CONNECTION=0
    -DTEM_SAMPLE=FALSE
    -DBLE_CALIBRATION_ENABLE=FALSE
