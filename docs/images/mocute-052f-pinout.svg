    <circle cx="1119" cy="326" r="18" class="marker"/><text x="1119" y="326" class="marker-text" style="font-size:20px">5</text>
    <text x="1154" y="334">Menu</text><text x="1390" y="334" class="pin">PB15</text><text x="1605" y="334">active LOW</text>

    <circle cx="1119" cy="375" r="18" class="marker"/><text x="1119" y="375" class="marker-text" style="font-size:20px">6</text>
    <text x="1154" y="383">OK trigger</text><text x="1390" y="383" class="pin">PA10</text><text x="1605" y="383">active LOW</text>

    <circle cx="1119" cy="424" r="18" class="marker-special"/><text x="1119" y="424" class="marker-text" style="font-size:20px">7</text>
    <text x="1154" y="432">KEY / GAME</text><text x="1390" y="432" class="pin">PA11</text><text x="1605" y="432">KEY=0 · GAME=1</text>

    <circle cx="1119" cy="473" r="18" class="marker-special"/><text x="1119" y="473" class="marker-text" style="font-size:20px">8</text>
    <text x="1154" y="481">Power / Back</text><text x="1390" y="481" class="pin">PA14</text><text x="1605" y="481">active HIGH</text>
  </g>

