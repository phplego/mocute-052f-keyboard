  <text x="1154" y="643" class="note">LOW = left · HIGH = right</text>

  <circle cx="1119" cy="694" r="21" class="marker-analog"/><text x="1119" y="694" class="marker-text" style="font-size:20px">J</text>
  <text x="1154" y="687" class="row">Vertical axis</text><text x="1390" y="687" class="row pin">PA13 / ADC3</text>
  <text x="1154" y="717" class="note">LOW = down · HIGH = up</text>

  <line x1="1100" y1="757" x2="1828" y2="757" stroke="#e4e7ec" stroke-width="2"/>
  <text x="1100" y="807" class="section">Board signals</text>
  <rect x="1101" y="842" width="68" height="35" rx="17" fill="#1683c7"/>
  <text x="1135" y="860" class="marker-text" style="font-size:16px">LED</text>
  <text x="1190" y="867" class="row">Indicator</text><text x="1390" y="867" class="row pin">PB7</text>
  <text x="1100" y="920" class="row">Power latch hold</text><text x="1390" y="920" class="row pin">PB23</text>
  <text x="1605" y="920" class="row">OUTPUT HIGH</text>

